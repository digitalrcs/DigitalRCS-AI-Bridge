name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/extension.js
          node --check src/streamText.js
          node --check src/contracts.js

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out digitalrcs-vscode-ai-bridge-${{ github.sha }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: digitalrcs-vscode-ai-bridge
          path: "*.vsix"

